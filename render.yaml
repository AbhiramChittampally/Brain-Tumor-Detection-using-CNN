services:
  - type: web
    name: brain-tumor-cnn
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GUNICORN_LOGLEVEL
        value: info

